name: Android app

# Builds the Android app (apps/mobile) with the real timetable on every push
# that touches the app. On the default branch it publishes a GitHub release:
# - Madeira-by-busses.apk, to install on a phone; the link
#   https://github.com/<repo>/releases/latest/download/Madeira-by-busses.apk
#   always points at the newest build (and so does .../MadeiraBus.apk, the
#   name of the first releases, so older links keep working);
# - Madeira-by-busses.aab, the bundle to upload to Google Play.
#
# Signing: add the repository secrets ANDROID_KEYSTORE_BASE64 (the keystore
# file, base64-encoded), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD to sign with your own key. Without them the APK is
# signed with the public test key in apps/mobile/android/app, which is enough
# for installing and updating outside Google Play.
on:
  push:
    paths:
      - apps/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile

      - name: Timetable
        run: |
          pnpm data
          pnpm data:real || echo "::warning title=Real timetable unavailable::The app was built with the demo network only."

      - name: Web app for the phone
        run: pnpm --filter @madeirabus/mobile build

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MADEIRABUS_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the repository's own key"
          else
            echo "::notice title=Public test key::Signed with the public test key; add the ANDROID_KEYSTORE_* secrets to use your own."
          fi

      - name: Build APK and Play bundle
        working-directory: apps/mobile/android
        env:
          MADEIRABUS_VERSION_CODE: ${{ github.run_number }}
          MADEIRABUS_VERSION_NAME: ${{ env.VERSION }}
          MADEIRABUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MADEIRABUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MADEIRABUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Madeira-by-busses.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/Madeira-by-busses.aab"
          cp "$GITHUB_WORKSPACE/Madeira-by-busses.apk" "$GITHUB_WORKSPACE/MadeiraBus.apk"
          ls -la "$GITHUB_WORKSPACE"/*.apk "$GITHUB_WORKSPACE"/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Madeira-by-busses-${{ env.VERSION }}
          path: |
            Madeira-by-busses.apk
            Madeira-by-busses.aab
          retention-days: 30

      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.VERSION }}
          name: Madeira by busses для Android ${{ env.VERSION }}
          make_latest: true
          files: |
            Madeira-by-busses.apk
            Madeira-by-busses.aab
            MadeiraBus.apk
          body: |
            **Як встановити:** відкрийте цю сторінку на телефоні, завантажте `Madeira-by-busses.apk`, відкрийте файл і дозвольте встановлення з цього джерела. Нові версії встановлюються поверх старої.

            **Google Play:** `Madeira-by-busses.aab` — файл для Play Console. `MadeiraBus.apk` — той самий застосунок під старою назвою, щоб працювали давні посилання.

            Застосунок працює без інтернету, знає розклад Horários do Funchal, CAM, Aerobus і SIGA Rodoeste і попереджає, коли виходити, навіть із вимкненим екраном. Новий розклад завантажує сам.

            **How to install:** open this page on your Android phone, download `Madeira-by-busses.apk`, open it and allow installing from this source. New versions install over the old one. `Madeira-by-busses.aab` is the bundle for Google Play.

            Built from ${{ github.sha }}.
