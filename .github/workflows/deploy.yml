name: Deploy website

# Publishes the app to GitHub Pages on every push to the default branch.
# One-time setup by a repository admin: Settings → Pages → Build and
# deployment → Source: "GitHub Actions". Until then this workflow only builds
# and leaves a notice instead of failing.
on:
  push:
  workflow_dispatch:
    inputs:
      data:
        description: Timetable source
        type: choice
        options: [demo, real]
        default: demo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is off::Enable it once: Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build timetable data
        run: pnpm ${{ inputs.data == 'real' && 'data:real' || 'data' }}
      - run: pnpm --filter @madeirabus/web build
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: apps/web/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
