name: Collect timetable sources

# Downloads the public sources for operators without a GTFS feed (CAM and
# SIGA Rodoeste timetables from the SIGA and operator websites; bus routes,
# stops, the walkable ways, built into walk.bin, and the roads buses drive on,
# built into drive.bin, from OpenStreetMap) and commits them to data/sources/
# on the same branch, for the pipeline to parse. Runs when the collector
# changes, or by hand.
on:
  push:
    paths:
      - scripts/fetch-sources.mjs
      - .github/workflows/sources.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Collect sources
        run: |
          # data/sources/siga has a collector of its own (siga.yml) that keeps what it saw on earlier days.
          find data/sources -mindepth 1 -maxdepth 1 ! -name siga -exec rm -rf {} +
          node scripts/fetch-sources.mjs data/sources
      - name: Walking network
        run: |
          if [ -f data/sources/osm/walk-ways.json ]; then
            pnpm --filter @madeirabus/pipeline cli walk \
              --osm ../../data/sources/osm/walk-ways.json --out ../../data/sources/osm/walk.bin
            rm data/sources/osm/walk-ways.json
          else
            echo "::warning title=Walking network not refreshed::No ways from Overpass; keeping the previous walk.bin."
            git checkout HEAD -- data/sources/osm/walk.bin || true
          fi
      - name: Road network
        run: |
          if [ -f data/sources/osm/drive-ways.json ]; then
            pnpm --filter @madeirabus/pipeline cli drive \
              --osm ../../data/sources/osm/drive-ways.json --out ../../data/sources/osm/drive.bin
            rm data/sources/osm/drive-ways.json
          else
            echo "::warning title=Road network not refreshed::No roads from Overpass; keeping the previous drive.bin."
            git checkout HEAD -- data/sources/osm/drive.bin || true
          fi
      - name: Streets and house numbers
        run: |
          if [ -f data/sources/osm/addresses-raw.json ]; then
            pnpm --filter @madeirabus/pipeline cli addresses \
              --osm ../../data/sources/osm/addresses-raw.json \
              --places ../../data/sources/osm/places.json \
              --out ../../data/sources/osm/addresses.json
            rm data/sources/osm/addresses-raw.json
          else
            echo "::warning title=Addresses not refreshed::No addresses from Overpass; keeping the previous addresses.json."
            git checkout HEAD -- data/sources/osm/addresses.json || true
          fi
      - name: Bounds of towns and villages
        run: |
          if [ -f data/sources/osm/areas-bounds.json ] && [ -f data/sources/osm/areas-anchors.json ]; then
            pnpm --filter @madeirabus/pipeline cli areas \
              --bounds ../../data/sources/osm/areas-bounds.json \
              --anchors ../../data/sources/osm/areas-anchors.json \
              --out ../../data/sources/osm/areas.json
            rm data/sources/osm/areas-bounds.json data/sources/osm/areas-anchors.json
          else
            echo "::warning title=Bounds not refreshed::No bounds from Overpass; keeping the previous areas.json."
            git checkout HEAD -- data/sources/osm/areas.json || true
          fi
      - name: Summary
        run: |
          {
            echo '### Timetable sources'
            echo '```json'
            jq '{fetchedAt, hf: (.hf.feedInfo // .hf), osm, pages: .web.pages, pdfs: (.web.pdfs | length), errors: (.web.errors | length)}' data/sources/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/sources
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -q -m "Update timetable sources ($(date -u +%Y-%m-%d))"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
