name: Collect SIGA routes

# Every day, records the whole timetable of CAM and SIGA Rodoeste and commits
# data/sources/siga/ on the same branch:
# - from the journey planner behind the SIGA website: every line, every trip
#   at every stop and the days each service runs (scripts/fetch-siga-timetable.mjs);
# - from the website's timetable pages: the lines that run that day, as a
#   check and a stand-by (scripts/fetch-siga.mjs). The site only shows a day
#   at a time; each day seen stands for the days of its kind to come.
# The website is then published again, so the app has the new timetable the
# same morning.
on:
  schedule:
    - cron: '23 6 * * *'
  push:
    paths:
      - scripts/fetch-siga.mjs
      - scripts/fetch-siga-timetable.mjs
      - .github/workflows/siga.yml
  workflow_dispatch:

permissions:
  contents: write
  # To start "Deploy website" (a push made with the workflow's token starts no workflow).
  actions: write

concurrency:
  group: siga-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect the timetable of the journey planner
        # A failure keeps the last timetable; the website's pages are still read.
        continue-on-error: true
        run: node scripts/fetch-siga-timetable.mjs data/sources/siga
      - name: Collect the day on the website
        run: node scripts/fetch-siga.mjs data/sources/siga
      - name: Summary
        run: |
          {
            echo '### SIGA routes'
            echo "- journey planner: $(wc -l < data/sources/siga/timetable/trips.jsonl) stop sequences, $(grep -c '_' data/sources/siga/timetable/services.json) services"
            echo "- variants known: $(wc -l < data/sources/siga/variants.jsonl)"
            echo "- stops known: $(grep -c '":\[' data/sources/siga/stops.json)"
            for f in data/sources/siga/days/*.jsonl; do
              if [ -f "$f" ]; then echo "- $(basename "$f" .jsonl): $(wc -l < "$f") variants running"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/siga
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -q -m "Update SIGA routes ($(date -u +%Y-%m-%d))"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the website with the new timetable
        if: steps.commit.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
