    <style>#launch{z-index:10000;background:#0056c7;justify-content:center;align-items:center;transition:opacity .25s ease-out;display:none;position:fixed;inset:0}.launching #launch{display:flex}#launch.launch--gone{opacity:0;pointer-events:none}#launch img{width:min(88vw,480px);height:auto}@media (prefers-reduced-motion:reduce){#launch{transition:none}}</style>
    <script>
      // Inside the Android app (Capacitor serves it from https://localhost) or the installed web app.
      (function () {
        var cap = window.Capacitor;
        var app =
          (cap && cap.isNativePlatform && cap.isNativePlatform()) ||
          (location.hostname === 'localhost' &&
            location.port === '' &&
            location.protocol === 'https:');
        var installed = window.matchMedia && matchMedia('(display-mode: standalone)').matches;
        if (!app && !installed) return;
        document.documentElement.classList.add('launching');
        var start = Date.now();
        window.__mbHideLaunch = function () {
          window.__mbHideLaunch = function () {};
          setTimeout(
            function () {
              var el = document.getElementById('launch');
              if (!el) return;
              el.classList.add('launch--gone');
              setTimeout(function () {
                el.remove();
                document.documentElement.classList.remove('launching');
              }, 300);
            },
            Math.max(0, 800 - (Date.now() - start)),
          );
        };
        // Never longer than this, even if the map is slow or fails to load.
        setTimeout(function () {
          window.__mbHideLaunch();
        }, 2500);
      })();
    </script>
