<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#002F85" />
    <meta
      name="description"
      content="Madeira by busses: journey planner for the Madeira bus network — routes with transfers, fares, timetables and GPS get-off alerts. Works offline."
    />
    <meta property="og:title" content="Madeira by busses" />
    <meta
      property="og:description"
      content="Explore Madeira with ease: buses, timetables and fares on your phone."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://nexgen-fullstack.github.io/Madeira-by-busses/og-image.jpg"
    />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="500" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Madeira by busses</title>
    <style>
      /* The phone app's launch screen: the logo, large, on the colour of Android's own
         splash screen, until the map is ready (src/lib/launch.ts). Not on the website. */
      #launch {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10000;
        align-items: center;
        justify-content: center;
        background: #0056c7;
        transition: opacity 250ms ease-out;
      }
      .launching #launch {
        display: flex;
      }
      #launch.launch--gone {
        opacity: 0;
        pointer-events: none;
      }
      #launch img {
        width: min(88vw, 480px);
        height: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        #launch {
          transition: none;
        }
      }
    </style>
    <script>
      // Inside the Android app (Capacitor serves it from https://localhost) or the installed web app.
      (function () {
        var cap = window.Capacitor;
        var app =
          (cap && cap.isNativePlatform && cap.isNativePlatform()) ||
          (location.hostname === 'localhost' &&
            location.port === '' &&
            location.protocol === 'https:');
        var installed = window.matchMedia && matchMedia('(display-mode: standalone)').matches;
        if (!app && !installed) return;
        document.documentElement.classList.add('launching');
        var start = Date.now();
        window.__mbHideLaunch = function () {
          window.__mbHideLaunch = function () {};
          setTimeout(
            function () {
              var el = document.getElementById('launch');
              if (!el) return;
              el.classList.add('launch--gone');
              setTimeout(function () {
                el.remove();
                document.documentElement.classList.remove('launching');
              }, 300);
            },
            Math.max(0, 800 - (Date.now() - start)),
          );
        };
        // Never longer than this, even if the map is slow or fails to load.
        setTimeout(function () {
          window.__mbHideLaunch();
        }, 2500);
      })();
    </script>
  </head>
  <body>
    <div id="launch" aria-hidden="true"><img src="./launch-logo.webp" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
